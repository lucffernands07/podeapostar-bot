name: Teste jogadores

on:
  push:
    paths:
      - 'testes/teste_jogadores.py'
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 🔥 PASSO NOVO: Roda o script que gera o 'jogos_hoje.json'
      - name: Gerar JSON com jogos do dia
        run: |
          # Altere 'main.py' para o nome exato do script que você usa para coletar as URLs da rodada
          python main.py --apenas-coleta || python main.py 

      - name: Rodar Teste jogadores
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python testes/teste_jogadores.py
        
