name: Teste de cartões 

on:
  push:
    paths:
      - 'testes/cartoes.py'        # Dispara automaticamente se houver commit em qualquer arquivo da pasta testes
  workflow_dispatch:       # Mantém o botão para você clicar em "Run Workflow" manualmente se quiser

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar Teste de cartões 
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python testes/cartoes.py
        
