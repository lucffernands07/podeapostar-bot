name: 2. Main Bot Apostas

on:
  push:
    paths:
      - 'main.py'
  schedule:
    # 04:11 UTC corresponde às 01:11 de Brasília (GMT-3)
    - cron: '11 4 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      # 🛠️ PASSO ADICIONADO ABAIXO PARA IMPLEMENTAR A SUA LÓGICA:
      - name: 🔒 Verificar se o bot já rodou hoje (Apenas para Automático)
        id: check_run
        # Só ativa a trava se o gatilho gerador for o Cron (schedule)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          HOJE=$(date +'%Y-%m-%d')
          ARQUIVO="ranking/pendentes.json"
          
          if [ -f "$ARQUIVO" ]; then
            echo "🔍 Rodada Automática detectada. Verificando data do JSON..."
            DATA_ARQUIVO=$(jq -r '.data_geracao' "$ARQUIVO")
            echo "📅 Data no arquivo: $DATA_ARQUIVO | Data de hoje (UTC): $HOJE"
            
            if [ "$DATA_ARQUIVO" = "$HOJE" ]; then
              echo "🚨 O bot já consolidou os dados hoje ($HOJE) na rodada manual anterior. Cancelando automação."
              gh run cancel ${{ github.run_id }}
              sleep 20
              exit 0
            fi
          else
            echo "ℹ️ Arquivo $ARQUIVO não encontrado. Seguindo com a automação."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: 1. Executar bot Selenium (Bilhetes de Hoje)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python main.py

      - name: 2. Salvar Dados (Ranking e Telegram) no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Adiciona as pastas para garantir que os arquivos do dia subam
          git add ranking/pendentes.json
          git add telegram/jogos_*.json
          
          # O commit com condicional evita travar o pipeline se o JSON não mudar
          git commit -m "Auto: Atualizando banco de dados e ranking [skip ci]" || echo "Sem alterações para salvar"
          
          # --- CORREÇÃO CIRÚRGICA DO ERRO DE LOCK REF ---
          # Puxa o repositório atualizado (com os menus novos) e empilha o JSON no topo
          git pull --rebase origin main
          
          git push origin main
          
