name: Main Bot Apostas

on:
  push:
    paths:
      - 'main.py'
  schedule:
    # 00:11 UTC corresponde às 21:11 de Brasília (GMT-3)
    - cron: '11 0 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: 1. Executar bot Selenium (Bilhetes de Hoje)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python main.py

      - name: 2. Salvar Dados (Ranking e Telegram) no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Adiciona as pastas para garantir que os arquivos do dia subam
          git add ranking/pendentes.json
          git add telegram/jogos_*.json
          
          # O commit com condicional evita travar o pipeline se o JSON não mudar
          git commit -m "Auto: Atualizando banco de dados e ranking [skip ci]" || echo "Sem alterações para salvar"
          
          # --- CORREÇÃO CIRÚRGICA DO ERRO DE LOCK REF ---
          # Puxa o repositório atualizado (com os menus novos) e empilha o JSON no topo
          git pull --rebase origin main
          
          git push origin main
          
