name: 2. Main Bot Apostas

on:
  push:
    paths:
      - 'main.py'
  schedule:
    # 03:37 UTC corresponde às 00:37 de Brasília (GMT-3)
    - cron: '37 3 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # 🔒 Trava para evitar dupla execução no modo automático (Cron)
      - name: 🔒 Verificar se o bot já rodou hoje (Apenas para Automático)
        id: check_run
        if: ${{ github.event_name == 'schedule' }}
        run: |
          HOJE=$(date +'%Y-%m-%d')
          ARQUIVO="ranking/pendentes.json"
          
          if [ -f "$ARQUIVO" ]; then
            echo "🔍 Rodada Automática detectada. Verificando data do JSON..."
            DATA_ARQUIVO=$(jq -r '.data_geracao' "$ARQUIVO")
            echo "📅 Data no arquivo: $DATA_ARQUIVO | Data de hoje (UTC): $HOJE"
            
            if [ "$DATA_ARQUIVO" = "$HOJE" ]; then
              echo "🚨 O bot já consolidou os dados hoje ($HOJE) na rodada manual anterior. Cancelando automação."
              gh run cancel ${{ github.run_id }}
              sleep 20
              exit 0
            fi
          else
            echo "ℹ️ Arquivo $ARQUIVO não encontrado. Seguindo com a automação."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      # 🎭 Instala o Chromium headless necessário para o Playwright raspar as escalações
      - name: Instalar navegadores do Playwright
        run: |
          python -m playwright install chromium --with-deps

      - name: 1. Executar bot Selenium (Bilhetes de Hoje)
        timeout-minutes: 90
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python main.py

      # ⚽ Executa a raspagem de prováveis logo após a geração dos jogos do dia
      - name: 2. Raspar Escalações Prováveis (Playwright)
        run: python -m telegram.raspagem_provaveis

      - name: 3. Salvar Dados (Ranking, Jogos e Prováveis) no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Adiciona o JSON do ranking, os jogos do dia e a pasta com as escalações prováveis
          git add ranking/pendentes.json
          git add telegram/jogos_*.json
          git add telegram/escalacoes/
          
          # O commit com condicional evita travar o pipeline se nenhum JSON mudar
          git commit -m "Auto: Atualizando banco de dados, jogos e escalações [skip ci]" || echo "Sem alterações para salvar"
          
          # Pull com rebase para evitar conflito de lock ref
          git pull --rebase origin main
          
          git push origin main

      - name: 4. Enviar JSON de Jogos para o Repositório do App Android (LifeBet)
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN_GH }} # Usando o PAT configurado nos Secrets para repositório privado
        run: |
          # Pega a data de hoje no formato YYYY-MM-DD
          DATA_HOJE=$(date +'%Y-%m-%d')
          ARQUIVO="telegram/jogos_$DATA_HOJE.json"

          if [ -f "$ARQUIVO" ]; then
            echo "Arquivo $ARQUIVO encontrado. Enviando para o LifeBet..."
            
            # Clona o repositório do app Android usando o Token personalizado
            git clone https://x-access-token:${GH_TOKEN}@github.com/lucffernands07/lifebet.git repo_android
            
            # Cria a pasta de destino dentro do projeto Android (na pasta assets)
            mkdir -p repo_android/app/src/main/assets/jogos/
            
            # Copia o JSON para dentro do projeto Android
            cp "$ARQUIVO" repo_android/app/src/main/assets/jogos/jogos_$DATA_HOJE.json
            
            cd repo_android
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add "app/src/main/assets/jogos/jogos_$DATA_HOJE.json"
            git commit -m "Auto: Atualizando JSON de jogos do dia $DATA_HOJE [skip ci]" || echo "Sem alterações para commitar"
            git push origin main
            
            echo "JSON enviado com sucesso para o LifeBet!"
          else
            echo "Aviso: O arquivo $ARQUIVO não foi encontrado para envio hoje."
          fi
          
