name: Main Bot Apostas

on:
  push:
    paths:
      - 'main.py'
  schedule:
    # 04:00 UTC corresponde às 01:00 de Brasília (GMT-3)
    - cron: '0 4 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: 1. Executar bot Selenium (Bilhetes de Hoje)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python main.py

      - name: 2. Salvar pendentes no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ranking/pendentes.json
          git commit -m "Auto: Atualizando lista de jogos para ranking" || echo "Sem alterações para salvar"
          git push
          
