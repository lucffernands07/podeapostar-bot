name: Controle de Usuarios e Banca

# 📡 O Workflow agora só acorda quando o seu Worker mandar um sinal via API
on:
  repository_dispatch:
    types: [clique_apostado, novo_registro]
  
  # Mantém este botão ativo só para caso você queira rodar um teste manual pelo painel do GitHub
  workflow_dispatch:

jobs:
  run-banca-sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    # 1. Traz o seu código privado atualizado para a máquina virtual
    - name: Checkout do Repositório
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    # 2. Prepara o Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instala a biblioteca do Telegram
    - name: Instalar Dependências
      run: |
        pip install pyTelegramBotAPI

    # 4. Executa a lógica baseado no tipo de evento enviado pelo seu Worker
    # O GitHub Actions consegue ler as variáveis que o seu Worker embutiu no clique!
    - name: Processar Movimentação de Banca
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        # Captura os dados que o seu Worker enviou no payload do clique
        USER_ID_ALVO: ${{ github.event.client_payload.user_id }}
        USER_NOME_ALVO: ${{ github.event.client_payload.user_name }}
        ACAO_EVENTO: ${{ github.event.action }}
      run: |
        python -c "
        import os
        from users.painel_admin import registrar_clique_apostado
        from users.controle_banca import registrar_novo_usuario
        
        user_id = os.environ.get('USER_ID_ALVO')
        nome = os.environ.get('USER_NOME_ALVO')
        acao = os.environ.get('ACAO_EVENTO')
        
        if acao == 'clique_apostado' and user_id:
            print(f'Processando clique Apostado para o ID: {user_id}')
            registrar_clique_apostado(user_id)
            
        elif acao == 'novo_registro' and user_id and nome:
            print(f'Processando novo registro para: {nome} ({user_id})')
            registrar_novo_usuario(user_id, nome)
        "

    # 5. Salva o JSON atualizado de volta no seu repositório privado
    - name: Salvar e Commitar Alterações no Banco JSON
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        if [ -n "$(git status --porcelain users/usuarios_db.json)" ]; then
          echo "Mudanças detectadas no arquivo de usuários. Salvando..."
          git add users/usuarios_db.json
          git commit -m "Auto-update: usuarios_db.json [skip ci]"
          git push origin main
        else
          echo "Nenhuma alteração de saldo necessária."
        fi
        
