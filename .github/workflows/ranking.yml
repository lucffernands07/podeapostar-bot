name: Atualizar Ranking Flashscore

on:
  push:
    paths:
      - 'ranking/ranking.py'
  schedule:
    # 03:05 UTC (00:05 AM Horário de Brasília)
    - cron: '5 3 * * *'
  workflow_dispatch: # Permite rodar manual quando você quiser testar os logs

jobs:
  run-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Instalar Dependências Python
        run: |
          pip install undetected-chromedriver selenium requests webdriver-manager Pillow pytesseract

      - name: Executar Script de Ranking
        run: |
          xvfb-run python ranking/ranking.py

      - name: Salvar Alterações (Git Push)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # Adiciona o banco de dados (ajustado para a raiz onde ele está sendo criado)
          # E adiciona o pendentes.json que foi limpo
          git add ranking_db.json ranking/pendentes.json
          
          # Tenta o commit; se não houver mudanças, não quebra o fluxo
          git diff --quiet && git diff --staged --quiet || (git commit -m "Ranking atualizado automaticamente [skip ci]" && git push)

