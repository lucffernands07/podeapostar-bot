name: Atualizar Ranking Flashscore

on:
  push:
    paths:
      - 'ranking/ranking.py'
  schedule:
    # 21:05 UTC (00:05 AM Horário de Brasília)
    - cron: '5 21 * * *'
  workflow_dispatch: # Permite rodar manual quando você quiser testar os logs

jobs:
  run-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Instalar Dependências Python
        run: |
          pip install undetected-chromedriver selenium requests webdriver-manager Pillow pytesseract

      - name: Executar Script de Ranking
        run: |
          xvfb-run python ranking/ranking.py

      - name: Commit e Push das atualizações
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # Garante a autenticação segura utilizando o token nativo do próprio GitHub Actions
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Adiciona apenas os arquivos que realmente importam e existem
          [ -f ranking/ranking_db.json ] && git add ranking/ranking_db.json
          [ -f ranking/pendentes.json ] && git add ranking/pendentes.json
          [ -f ranking/ranking_diario.json ] && git add ranking/ranking_diario.json
          
          # Só faz o commit se houver alguma modificação real nos arquivos adicionados
          git diff-index --quiet HEAD || git commit -m "Ranking atualizado: $(date +'%d/%m/%Y %H:%M')"
          
          git push origin main
          
