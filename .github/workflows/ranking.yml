name: 1. Atualizar Ranking Flashscore

on:
  push:
    paths:
      - 'ranking/ranking.py'
  schedule:
    # 03:11 UTC (00:11 Horário de Brasília)
    - cron: '11 3 * * *'
  workflow_dispatch: # Permite rodar manual quando você quiser testar os logs

jobs:
  run-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 🔒 TRAVA ADICIONADA: Protege contra duplicidade apenas na execução automática do Cron
      - name: 🔒 Verificar se o ranking já rodou hoje (Apenas para Automático)
        id: check_run
        if: ${{ github.event_name == 'schedule' }}
        run: |
          HOJE=$(date +'%Y-%m-%d')
          ARQUIVO="ranking/pendentes.json"
          
          if [ -f "$ARQUIVO" ]; then
            echo "🔍 Rodada Automática de Ranking detectada. Verificando data..."
            DATA_ARQUIVO=$(jq -r '.data_geracao' "$ARQUIVO")
            echo "📅 Data no arquivo: $DATA_ARQUIVO | Data de hoje (UTC): $HOJE"
            
            if [ "$DATA_ARQUIVO" = "$HOJE" ]; then
              echo "🚨 O ranking já foi atualizado hoje ($HOJE) na rodada manual anterior. Cancelando automação."
              gh run cancel ${{ github.run_id }}
              sleep 20
              exit 0
            fi
          else
            echo "ℹ️ Arquivo $ARQUIVO não encontrado. Seguindo com a automação."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Instalar Dependências Python
        run: |
          pip install undetected-chromedriver selenium requests webdriver-manager Pillow pytesseract

      - name: Executar Script de Ranking
        run: |
          xvfb-run python ranking/ranking.py

      - name: Commit e Push das atualizações
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # Garante a autenticação segura utilizando o token nativo do próprio GitHub Actions
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Adiciona apenas os arquivos que realmente importam e existem
          [ -f ranking/ranking_db.json ] && git add ranking/ranking_db.json
          [ -f ranking/pendentes.json ] && git add ranking/pendentes.json
          [ -f ranking/ranking_diario.json ] && git add ranking/ranking_diario.json
          
          # Só faz o commit se houver alguma modificação real nos arquivos adicionados
          git diff-index --quiet HEAD || git commit -m "Ranking atualizado: $(date +'%d/%m/%Y %H:%M')"
          
          git push origin main
          
