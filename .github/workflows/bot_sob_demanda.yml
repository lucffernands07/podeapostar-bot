name: Bot Telegram Sob Demanda

on:
  repository_dispatch:
    types: [comando_telegram]

jobs:
  executar_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Dependências
        run: |
          pip install requests
          # Se o seu bingo357 ou outros módulos usarem algo do requirements.txt, 
          # descomente a linha abaixo para evitar erros de "ModuleNotFoundError"
          # pip install -r requirements.txt

      - name: Processar Pedido do Usuário
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          # O payload do Telegram envia o chat_id e o tipo (BINGO 3, PREMIUM, etc)
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          TIPO_BINGO: ${{ github.event.client_payload.tipo }}
        run: python telegram/processador.py
        
