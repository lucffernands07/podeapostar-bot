name: 🧪 Teste Raspagem Escalações Prováveis

on:
  push:
    paths:
      - 'telegram/raspagem_provaveis.py'
  workflow_dispatch:
  # 👈 Adicionado para ouvir a chamada da API do Cloudflare Worker
  repository_dispatch:
    types: [atualizar_provaveis, comando_telegram]

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependências e Playwright
        run: |
          pip install -r requirements.txt
          pip install playwright bs4
          playwright install chromium

      - name: 🚀 Executar Raspagem de Teste
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TIPO: ${{ github.event.client_payload.tipo }}
        run: |
          python telegram/raspagem_provaveis.py

      - name: 💾 Salvar Resultado no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add telegram/escalacoes/provaveis.json telegram/provaveis.json provaveis.json || true
          git commit -m "Atualizando escalações prováveis [skip ci]" || echo "Sem alterações para salvar"
          git push origin main
