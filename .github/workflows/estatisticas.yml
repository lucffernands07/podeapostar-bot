name: 1. Gerador de Resultados para app LifeBet

on:
  schedule:
    # 03:07 UTC (00:07 AM Horário de Brasília) - Processa os Resultados de Ontem
    - cron: '07 3 * * *'
  workflow_dispatch: # Permite testar manualmente no GitHub Actions

jobs:
  rodar-estatisticas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Google Chrome e Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Instalar Dependências
        run: |
          pip install selenium webdriver-manager

      # Executa o script correto na pasta resultados/
      - name: Processar Resultados de Ontem
        run: |
          xvfb-run python resultados/raspagem_resultados.py

      # Salva o JSON de resultados gerado de volta no repositório podeapostar-bot
      - name: Commit e Push no podeapostar-bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Adiciona os arquivos JSON de resultados gerados na pasta resultados
          git add resultados/resultados_*.json
          
          git diff-index --quiet HEAD || git commit -m "Resultados de ontem atualizados: $(date +'%d/%m/%Y %H:%M')"
          git push origin main

      # Envia o JSON gerado para o repositório do app Android (lifebet)
      - name: Enviar Resultados para o LifeBet App
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN_GH }} # Token pessoal com permissão nos dois repositórios
        run: |
          # Pega dinamicamente o arquivo de resultados de ontem gerado pelo script
          DATA_ONTEM=$(date -d "yesterday" '+%Y-%m-%d')
          ARQUIVO_RESULTADO="resultados/resultados_${DATA_ONTEM}.json"

          if [ -f "$ARQUIVO_RESULTADO" ]; then
            echo "Enviando $ARQUIVO_RESULTADO para o app Android..."
            
            # Clona o repositório do app Android
            git clone https://x-access-token:${GH_TOKEN}@github.com/lucffernands07/lifebet.git repo_android
            
            # Cria a pasta de destino nos assets do app
            mkdir -p repo_android/app/src/main/assets/resultados/
            
            # Copia o arquivo de resultados para a pasta correta
            cp "$ARQUIVO_RESULTADO" repo_android/app/src/main/assets/resultados/
            
            cd repo_android
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add "app/src/main/assets/resultados/"
            git commit -m "Auto: Atualizando resultados de ${DATA_ONTEM} [skip ci]" || echo "Sem alterações para commitar"
            git push origin main
            
            echo "Resultados enviados com sucesso para o LifeBet!"
          else
            echo "Aviso: O arquivo de resultados ${ARQUIVO_RESULTADO} não foi encontrado."
          fi
          
