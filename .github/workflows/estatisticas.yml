name: 1. Gerador de Resultados para app LifeBet

on:
  schedule:
    # 05:11 UTC (02:11 AM Horário de Brasília) - Processa os Resultados de Ontem
    - cron: '11 5 * * *'
  workflow_dispatch: # Permite que você clique em "Run workflow" para testar manualmente agora

jobs:
  rodar-estatisticas:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar Google Chrome e Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Instalar Dependências
        run: |
          pip install selenium webdriver-manager

      # Executa o script direto que valida o pendentes.json e cruza os dados
      - name: Processar Resultados de Ontem
        run: |
          xvfb-run python estatisticas/analisador.py

      # SALVAMENTO SEGURO: Salva as alterações e os novos JSONs de volta no repositório
      - name: Commit e Push das atualizações
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Garante a inclusão do histórico global atualizado
          [ -f estatisticas/padroes_db.json ] && git add estatisticas/padroes_db.json
          
          # AJUSTE: Adiciona dinamicamente os novos arquivos de links gerados para hoje e amanhã
          git add estatisticas/links_*.json
          
          # Só commita se houver mudanças reais para não quebrar a esteira
          git diff-index --quiet HEAD || git commit -m "Estatísticas e Links atualizados: $(date +'%d/%m/%Y %H:%M')"
          git push origin main

      # NOVO PASSO: Envia os resultados auditados para o repositório do app Android
      - name: Enviar Resultados Auditados para o LifeBet App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARQUIVO_PADROES="estatisticas/padroes_db.json"

          if [ -f "$ARQUIVO_PADROES" ]; then
            echo "Processando resultados para o app Android..."
            
            # Clona o repositório do app Android usando o token nativo
            git clone https://x-access-token:${GH_TOKEN}@github.com/lucffernands07/lifebet.git repo_android
            
            # Cria a pasta de destino no projeto Android
            mkdir -p repo_android/app/src/main/assets/resultados/
            
            # Copia o banco de padrões para dentro dos assets do app
            cp "$ARQUIVO_PADROES" repo_android/app/src/main/assets/resultados/padroes_db.json
            
            cd repo_android
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add "app/src/main/assets/resultados/padroes_db.json"
            git commit -m "Auto: Atualizando resultados e auditoria do dia [skip ci]" || echo "Sem alterações para commitar"
            git push origin main
            
            echo "Resultados enviados com sucesso para o LifeBet!"
          else
            echo "Aviso: Arquivo de padrões não encontrado."
          fi
          
