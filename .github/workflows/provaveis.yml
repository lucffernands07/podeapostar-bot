name: 🧪 Teste Raspagem Escalações Prováveis

on:
  push:
    paths:
      - 'telegram/raspagem_provaveis.py'
  workflow_dispatch:
  repository_dispatch:
    types: [atualizar_provaveis, ver_provaveis]

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Dependências
        run: |
          pip install -r requirements.txt
          pip install playwright bs4 requests
          playwright install chromium

      # 1. RODA A RASPAGEM SOMENTE EM ATUALIZAÇÕES, PUSH OU MANUAL
      - name: 🚀 Executar Raspagem de Teste
        if: github.event.action == 'atualizar_provaveis' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TIPO: ${{ github.event.client_payload.tipo }}
        run: |
          python telegram/raspagem_provaveis.py

      # 2. SALVA NO REPOSITÓRIO SE HOUVE RASPAGEM
      - name: 💾 Salvar Resultado no Repositório
        if: github.event.action == 'atualizar_provaveis' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram/escalacoes/provaveis.json
          git commit -m "bot: atualiza escalações prováveis [skip ci]" || echo "Sem alterações para salvar"
          git push origin main

      # 3. ENVIA AS MENSAGENS PARA O TELEGRAM (Usa o processador.py com os filtros de horário)
      - name: 📢 Postar Escalações no Telegram
        if: github.event.action == 'atualizar_provaveis' || github.event.action == 'ver_provaveis' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TIPO: ${{ github.event.client_payload.tipo || 'VER_PROVAVEIS' }}
        run: |
          python telegram/processador.py
          
