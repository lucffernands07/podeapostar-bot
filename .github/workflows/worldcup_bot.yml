name: World Cup Bot Apostas (Sumário)

on:
  push:
    paths:
      - 'sumario_mercados.py'
  schedule:
    # 06:11 UTC corresponde às 03:11 de Brasília (GMT-3)
    # Horário ideal para rodar os sumários dos jogos da Copa do Mundo do dia
    - cron: '11 6 * * *'
  workflow_dispatch: 

jobs:
  run-wc-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: 1. Executar Bot de Sumários da Copa do Mundo
        timeout-minutes: 15
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python sumario_mercados.py
        
