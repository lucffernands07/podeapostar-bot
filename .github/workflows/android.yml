name: Compilar APK do Livro

on:
  push:
    branches: [ "main", "master" ] # Roda automaticamente se você enviar código para a branch principal
  workflow_dispatch: # Permite que você clique em um botão e gere o APK manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Dar permissão de execução ao Gradle
      run: chmod +x ./gradlew

    - name: Compilar o APK de Teste (Debug)
      run: ./gradlew assembleDebug

    - name: Disponibilizar o APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: app-livro-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
